name: 自动签到

on:
  schedule:
    # 每天 8:00 执行
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 安装依赖
        run: npm install puppeteer
      
      - name: 执行签到
        run: node signin.js
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
      
      - name: 打印环境变量
        run: |
          echo "USERNAME: $USERNAME"
        env:
          USERNAME: ${{ secrets.USERNAME }}
      
      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
